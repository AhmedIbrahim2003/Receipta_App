publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_nfc_kit: ^3.6.2
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  ndef: ^0.4.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  uuid: ^4.6.0
  supabase_flutter: ^2.17.2
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
